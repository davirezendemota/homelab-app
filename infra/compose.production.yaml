name: homelab-app

services:
  app:
    image: homelab-app
    build:
      context: ..
      dockerfile: infra/Dockerfile.production
    container_name: homelab-app
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      TZ: America/Sao_Paulo
      LINK_HOST: homelab01
      DOCKER_SOCKET: /var/run/docker.sock
      HOST_ROOT: /host
      DB_PATH: /app/data/homepage.db
    volumes:
      - ../data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro,rslave
    group_add:
      - "990"
