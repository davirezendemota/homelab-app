name: homelab-app

# Deploy: make deploy  (= BUILD_ID=<git sha> docker compose -f infra/compose.production.yaml up -d --build)
# Imagem FROM scratch (~14 MB) com binário Go estático; healthcheck embutido na imagem.
services:
  app:
    image: homelab-app:v3
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    container_name: homelab-app
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      TZ: America/Sao_Paulo
      LINK_HOST: homelab01
    volumes:
      # data/ precisa pertencer ao uid 65532 (usuário da imagem): sudo chown -R 65532:65532 data
      - ../data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro,rslave
    group_add:
      - "990" # GID do grupo docker no host (getent group docker)
    read_only: true
    cap_drop: [ALL]
    # Ler /host/proc/<pid>/cwd e environ dos agentes no host (uid ≠ 65532 do container).
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
    mem_limit: 64m
